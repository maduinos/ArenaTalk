[project]
name = "arenatalk"
version = "0.0.1"
description = "ArenaTalk — CharacterPet debate arena with Elo ranking"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
tui = ["textual>=0.80"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
# 기본 진입점 = GUI. CLI는 arenatalk list|ranks|debate|backends
arenatalk = "arenatalk.__main__:main"
arenatalk-play = "arenatalk.game.window:run_game_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arenatalk*"]

[tool.setuptools.package-data]
arenatalk = ["assets/icons/*"]

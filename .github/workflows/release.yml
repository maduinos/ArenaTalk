name: Release build

# Builds the distributables and leaves them as workflow artifacts. Publishing
# is deliberately manual: uploading to the public maduinos/arenatalk-releases
# repo would need a cross-repo token stored here, and a maintainer's existing
# `gh` login can do the same job from a laptop:
#
#   gh release upload <tag> --repo maduinos/arenatalk-releases <files>
#
# Private-repo Actions minutes are metered (2,000/month on the free plan), so
# this never runs on an ordinary push — only on a version tag or by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    name: deb (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,packaging]"

      - name: Build .deb
        run: tools/build_ubuntu_deb.sh

      - name: Checksum
        run: sha256sum dist/ubuntu/*.deb | tee dist/ubuntu/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: arenatalk-deb
          path: |
            dist/ubuntu/*.deb
            dist/ubuntu/SHA256SUMS
          if-no-files-found: error

  windows:
    name: exe (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,packaging]"

      - name: Build .exe
        run: pyinstaller --noconfirm --clean packaging/arenatalk-windows.spec

      - name: Smoke — the frozen exe runs
        shell: pwsh
        run: |
          # The exe is GUI-subsystem, so PowerShell would return without
          # waiting on a bare call. Start-Process -Wait gives a real exit code,
          # and redirecting stdout hands the child a valid handle to print to.
          # NB: do not name the parameter $Args — it is a PowerShell automatic
          # variable, and shadowing it drops the arguments. A bare launch means
          # "open the GUI", so -Wait would then hang until the job times out.
          function Run-Exe([string[]]$ExeArgs, [int[]]$Ok) {
            $p = Start-Process -FilePath .\dist\arenatalk.exe -ArgumentList $ExeArgs `
                   -Wait -PassThru -NoNewWindow `
                   -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            Write-Host "$ arenatalk $($ExeArgs -join ' ') -> $($p.ExitCode)"
            Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
            if ($Ok -notcontains $p.ExitCode) {
              throw "unexpected exit $($p.ExitCode)"
            }
          }
          Run-Exe -ExeArgs @('--help') -Ok @(0)
          # `backends` exits 1 with no agent CLI installed — normal on a runner.
          Run-Exe -ExeArgs @('backends') -Ok @(0, 1)

      - name: Name the artifact after the version
        shell: pwsh
        run: |
          $v = (python -c "from arenatalk import __version__; print(__version__)")
          Move-Item dist\arenatalk.exe "dist\arenatalk-$v-win64.exe"
          (Get-FileHash "dist\arenatalk-$v-win64.exe" -Algorithm SHA256).Hash.ToLower() `
            + "  arenatalk-$v-win64.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: arenatalk-exe
          path: |
            dist/arenatalk-*-win64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

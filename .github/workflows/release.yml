name: Release build

# Builds the distributables and leaves them as workflow artifacts. Publishing
# is deliberately manual: uploading to the public maduinos/arenatalk-releases
# repo would need a cross-repo token stored here, and a maintainer's existing
# `gh` login can do the same job from a laptop:
#
#   gh release upload <tag> --repo maduinos/arenatalk-releases <files>
#
# Private-repo Actions minutes are metered (2,000/month on the free plan), so
# this never runs on an ordinary push — only on a version tag or by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    name: deb (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,packaging]"

      - name: Build .deb
        run: tools/build_ubuntu_deb.sh

      - name: Checksum
        run: sha256sum dist/ubuntu/*.deb | tee dist/ubuntu/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: arenatalk-deb
          path: |
            dist/ubuntu/*.deb
            dist/ubuntu/SHA256SUMS
          if-no-files-found: error

  windows:
    name: exe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,packaging]"

      - name: Build .exe
        run: pyinstaller --noconfirm --clean packaging/arenatalk-windows.spec

      - name: Smoke — the frozen exe runs
        run: |
          dist\arenatalk.exe --help
          dist\arenatalk.exe backends
        shell: cmd

      - name: Name the artifact after the version
        shell: pwsh
        run: |
          $v = (python -c "from arenatalk import __version__; print(__version__)")
          Move-Item dist\arenatalk.exe "dist\arenatalk-$v-win64.exe"
          (Get-FileHash "dist\arenatalk-$v-win64.exe" -Algorithm SHA256).Hash.ToLower() `
            + "  arenatalk-$v-win64.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: arenatalk-exe
          path: |
            dist/arenatalk-*-win64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # These steps echo the app's Korean output; without this the harness
      # itself dies encoding it on a cp1252 Windows runner.
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is the release baseline (PyInstaller links the build host's
        # glibc, so a 24.04 build would not run on 22.04 desktops).
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Test
        run: python -m pytest -q

      - name: Smoke — CLI
        shell: python
        run: |
          import subprocess, sys

          # `backends` exits 1 when no agent CLI is installed, which is every
          # CI runner. Anything above that is a real crash.
          for args, ok in ((["backends"], (0, 1)), (["list"], (0,))):
              p = subprocess.run([sys.executable, "-m", "arenatalk", *args],
                                 capture_output=True, text=True,
                                 encoding="utf-8", errors="replace")
              print(f"$ arenatalk {' '.join(args)} -> {p.returncode}")
              print(p.stdout or p.stderr)
              if p.returncode not in ok:
                  sys.exit(f"unexpected exit {p.returncode}")

      - name: Smoke — GUI boots offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import subprocess, sys
          # The GUI runs until closed; a clean timeout means it started fine.
          try:
              proc = subprocess.run(
                  [sys.executable, "-m", "arenatalk"],
                  timeout=45,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
          except subprocess.TimeoutExpired:
              print("GUI stayed up for 45s — OK")
              sys.exit(0)
          print(proc.stdout)
          print(proc.stderr, file=sys.stderr)
          sys.exit(f"GUI exited early with {proc.returncode}")

      - name: Smoke — agent CLI output decodes as UTF-8
        shell: python
        run: |
          # Regression guard for the cp949 mojibake class of bug: a child
          # process emitting UTF-8 Korean must survive _run() on any locale.
          import sys
          from arenatalk.adapters.cli_agents import _run

          out = _run([sys.executable, "-c",
                      "import sys; sys.stdout.write('한글 토론 테스트 ✓')"])
          assert out.stdout == "한글 토론 테스트 ✓", repr(out.stdout)
          print("UTF-8 round-trip OK:", out.stdout)
